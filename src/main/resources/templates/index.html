<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Registration</title>
</head>
<body>

<h2>Employee Registration</h2>

<form id="employeeForm">
    Employee ID: <input type="text" id="employeeId"><br><br>
    Employee Name: <input type="text" id="employeeName"><br><br>
    Email: <input type="email" id="email"><br><br>
    Location: <input type="text" id="location"><br><br>
    <button type="button" onclick="submitForm()">Save</button>
</form>

<script>
    function submitForm() {
        fetch('/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                employeeId: document.getElementById('employeeId').value,
                employeeName: document.getElementById('employeeName').value,
                email: document.getElementById('email').value,
                location: document.getElementById('location').value
            })
        }).then(() => alert("Employee Saved Successfully"));
    }
</script>

</body>
</html>
